name: Release gates

on:
  pull_request:
  push:
    branches: [main, codex/internal-test-deploy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:prod
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:ops
      - run: node --test deploy/cloudflare/staging-gateway/worker.test.mjs
      - run: pnpm build
      - run: pnpm exec prettier --check "**/*.{ts,tsx,md,json,yml,yaml}"
      - run: git diff --check

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/supplier
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/supplier
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f infra/docker-compose.ci.yml up -d --wait postgres
      - run: pnpm --filter @supplier/bff... build
      - run: pnpm db:migrate:deploy
      - run: node scripts/seed.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:integration
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop browser test infrastructure
        if: always()
        run: docker compose -f infra/docker-compose.ci.yml down -v

  images:
    needs: [verify, browser]
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build immutable runtime targets
        run: |
          docker build --target bff -t supplier-bff:${IMAGE_TAG} .
          docker build --target migrate -t supplier-migrate:${IMAGE_TAG} .
          docker build --target staging-maintenance \
            --build-arg SUPPLIER_GIT_SHA=${IMAGE_TAG} \
            -t supplier-staging-maintenance:${IMAGE_TAG} .
          docker build --target web -t supplier-web:${IMAGE_TAG} \
            --build-arg NEXT_PUBLIC_AUTH_MODE=supabase \
            --build-arg NEXT_PUBLIC_SIGNUP_ENABLED=false \
            --build-arg NEXT_PUBLIC_BFF_URL=https://api.ci.example \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://auth.ci.example \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-public-anon-key .
      - name: Run migrations and production smoke tests
        run: |
          set -euo pipefail
          docker network create supplier-ci
          cleanup() {
            docker rm -f supplier-web-ci supplier-bff-ci supplier-postgres-ci >/dev/null 2>&1 || true
            docker network rm supplier-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name supplier-postgres-ci --network supplier-ci \
            --network-alias db.abcdefghijklmnopqrst.supabase.co \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=secret -e POSTGRES_DB=postgres \
            postgres:15-alpine
          for attempt in $(seq 1 30); do
            if docker exec supplier-postgres-ci pg_isready -U postgres -d postgres >/dev/null 2>&1; then break; fi
            if [ "$attempt" = 30 ]; then docker logs supplier-postgres-ci; exit 1; fi
            sleep 1
          done

          # Supabase creates these PostgREST roles before application migrations.
          # The clean PostgreSQL smoke database must model that prerequisite so
          # the immutable, already-applied security migration keeps its checksum.
          docker exec -i supplier-postgres-ci \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < infra/postgres/init-supabase-roles.sql

          docker run --rm --network supplier-ci \
            -e DATABASE_URL=postgresql://postgres:secret@db.abcdefghijklmnopqrst.supabase.co:5432/postgres \
            -e DIRECT_URL=postgresql://postgres:secret@db.abcdefghijklmnopqrst.supabase.co:5432/postgres \
            supplier-migrate:${IMAGE_TAG}

          docker run --rm --network supplier-ci \
            -e DATABASE_URL=postgresql://postgres:secret@db.abcdefghijklmnopqrst.supabase.co:5432/postgres \
            -e DIRECT_URL=postgresql://postgres:secret@db.abcdefghijklmnopqrst.supabase.co:5432/postgres \
            supplier-migrate:${IMAGE_TAG} \
            migrate status --schema node_modules/@supplier/db/prisma/schema.prisma

          docker run --rm --network supplier-ci \
            -e DATABASE_URL=postgresql://postgres:secret@db.abcdefghijklmnopqrst.supabase.co:5432/postgres \
            -e DIRECT_URL=postgresql://postgres:secret@db.abcdefghijklmnopqrst.supabase.co:5432/postgres \
            supplier-migrate:${IMAGE_TAG} \
            migrate diff --exit-code \
            --from-url postgresql://postgres:secret@db.abcdefghijklmnopqrst.supabase.co:5432/postgres \
            --to-schema-datamodel node_modules/@supplier/db/prisma/schema.prisma

          docker exec -i supplier-postgres-ci \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < infra/postgres/assert-public-schema-isolation.sql

          docker exec -i supplier-postgres-ci \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < infra/postgres/assert-workflow-check-constraints.sql

          docker exec -i supplier-postgres-ci \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < packages/db/scripts/assert-43-to-44-sku-edits.sql

          docker exec -i supplier-postgres-ci \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < packages/db/scripts/assert-44-to-45-runtime-state.sql

          docker run -d --name supplier-bff-ci --network supplier-ci -p 3101:3001 \
            -e NODE_ENV=production -e AUTH_MODE=supabase \
            -e SUPABASE_URL=https://abcdefghijklmnopqrst.supabase.co \
            -e SUPABASE_JWT_SECRET=ci-jwt-secret-that-is-longer-than-thirty-two \
            -e DATABASE_URL=postgresql://postgres:secret@db.abcdefghijklmnopqrst.supabase.co:5432/postgres \
            -e ENCRYPTION_KEY=ci-encryption-key-that-is-longer-than-thirty-two \
            -e OPERATIONS_TOKEN=ci-operations-token-that-is-longer-than-thirty-two \
            -e ALERT_WEBHOOK_URL=https://alerts.ci.example/hooks/supplier \
            -e ALERT_WEBHOOK_SECRET=ci-alert-webhook-secret-longer-than-thirty-two \
            -e CORS_ORIGINS=https://supplier.ci.example \
            -e PUBLISH_QUEUE_MODE=database \
            supplier-bff:${IMAGE_TAG}
          docker run -d --name supplier-web-ci -p 3100:3000 supplier-web:${IMAGE_TAG}

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3101/api/health/ready >/dev/null && \
               curl -fsS http://127.0.0.1:3100/ >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then docker logs supplier-bff-ci; docker logs supplier-web-ci; exit 1; fi
            sleep 1
          done

          ALLOW_INSECURE_DEPLOY_VERIFY=true \
          BFF_URL=http://127.0.0.1:3101 \
          WEB_URL=http://127.0.0.1:3100 \
          DEPLOY_VERIFY_CORS_ORIGIN=https://supplier.ci.example \
          OPERATIONS_TOKEN=ci-operations-token-that-is-longer-than-thirty-two \
          node scripts/verify-deployment.mjs

          test "$(docker image inspect supplier-bff:${IMAGE_TAG} --format '{{.Config.User}}')" = node
          test "$(docker image inspect supplier-web:${IMAGE_TAG} --format '{{.Config.User}}')" = node
          test "$(docker image inspect supplier-staging-maintenance:${IMAGE_TAG} --format '{{.Config.User}}')" = node
          test "$(docker image inspect supplier-staging-maintenance:${IMAGE_TAG} --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${IMAGE_TAG}"
          docker run --rm --read-only --tmpfs /tmp --user node --cap-drop ALL \
            --security-opt no-new-privileges \
            supplier-staging-maintenance:${IMAGE_TAG} \
            -e "require('./packages/db/node_modules/@prisma/client'); require('fs').accessSync('infra/postgres/certs/supabase-prod-ca-2021.crt')"
          docker stop supplier-bff-ci supplier-web-ci
          test "$(docker inspect supplier-bff-ci --format '{{.State.ExitCode}}')" = 0
          test "$(docker inspect supplier-web-ci --format '{{.State.ExitCode}}')" = 0
