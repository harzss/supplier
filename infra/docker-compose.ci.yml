services:
  # 仅供 GitHub Actions 的隔离自动化测试使用；开发、staging/runtime 必须直连 Supabase。
  postgres:
    image: postgres:15-alpine
    container_name: supplier-postgres
    restart: 'no'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supplier
    ports:
      - '127.0.0.1:5432:5432'
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=512m
    volumes:
      - ./postgres/init-supabase-roles.sql:/docker-entrypoint-initdb.d/010-supabase-roles.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U postgres -d supplier && psql -v ON_ERROR_STOP=1 -U postgres -d supplier -f /docker-entrypoint-initdb.d/010-supabase-roles.sql >/dev/null',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
