services:
  # 仅供隔离自动化测试使用；staging/runtime 必须直连 Supabase。
  # 通过 `pnpm db:test:up` 启动；该入口会等待角色 bootstrap healthcheck 完成。
  postgres:
    image: postgres:15-alpine
    container_name: supplier-postgres
    restart: 'no'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supplier
    ports:
      - '127.0.0.1:5432:5432'
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=512m
    volumes:
      - ./postgres/init-supabase-roles.sql:/docker-entrypoint-initdb.d/010-supabase-roles.sql:ro
    healthcheck:
      # docker-entrypoint-initdb.d only runs for a new volume. Replaying this
      # idempotent role bootstrap also upgrades older postgres_data volumes
      # before Prisma migrations are allowed to treat the service as healthy.
      test:
        [
          'CMD-SHELL',
          'pg_isready -U postgres -d supplier && psql -v ON_ERROR_STOP=1 -U postgres -d supplier -f /docker-entrypoint-initdb.d/010-supabase-roles.sql >/dev/null',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
